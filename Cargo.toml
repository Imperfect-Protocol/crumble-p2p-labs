[workspace]
resolver = "2"
members = [
    "apps/crum_bot",
    "apps/crum_hu_bot",
    "apps/crum_p2p_bot",
    "lib/crum_bls",
    "lib/crum_net",
    "lib/crum_pkr",
]

[workspace.dependencies]
alloy-primitives = "1.5.7"
alloy-network = "0.11.1"
alloy-provider = { version = "0.11.1", features = ["reqwest"] }
alloy-rpc-types-eth = "0.11.1"
alloy-signer-local = "0.11.1"
alloy-sol-types = "1.4.1"
bls12_381 = { version = "0.8.0", features = ["experimental"] }
bytes = "1.10.1"
crum_bls = { path = "lib/crum_bls" }
crum_net = { path = "lib/crum_net" }
crum_pkr = { path = "lib/crum_pkr" }
digest = "0.9.0"
ff = "0.13.1"
hex = "0.4.3"
itertools = "0.14.0"
k256 = "0.13.4"
pairing = "0.23.0"
rand_core = "=0.6.4"
rand = "0.8"
nson = "0.14.0"
serde = "=1.0.220"
serde_json = "=1.0.140"
tokio = { version = "1.12.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
